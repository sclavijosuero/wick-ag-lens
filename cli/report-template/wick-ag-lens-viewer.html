<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WICK-AG-Lens Report Viewer</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f4; --border: #d9dde5;
    --text: #1b1f27; --muted: #5d6676; --accent: #2457d6; --accent-soft: #e3ebff;
    --critical: #b3261e; --serious: #c4560a; --moderate: #8a6d00; --minor: #1f6f8b;
    --manual: #6b4bb8; --informative: #4b5565;
    --good: #1c7c3c; --good-soft: #def3e4; --bad: #b3261e; --bad-soft: #fde7e5;
    --carry: #6b4bb8; --carry-soft: #ece6fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --panel-2: #1e232d; --border: #2b3240;
      --text: #e6e9ef; --muted: #98a1b3; --accent: #7aa2ff; --accent-soft: #1c2742;
      --critical: #ff8a80; --serious: #ffab66; --moderate: #f0d060; --minor: #6cc4e0;
      --manual: #b9a0f5; --informative: #aab3c4;
      --good: #6fd08c; --good-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1b19;
      --carry: #b9a0f5; --carry-soft: #2a2145;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b23; --panel-2: #1e232d; --border: #2b3240;
    --text: #e6e9ef; --muted: #98a1b3; --accent: #7aa2ff; --accent-soft: #1c2742;
    --critical: #ff8a80; --serious: #ffab66; --moderate: #f0d060; --minor: #6cc4e0;
    --manual: #b9a0f5; --informative: #aab3c4;
    --good: #6fd08c; --good-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1b19;
    --carry: #b9a0f5; --carry-soft: #2a2145;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .file-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--accent); color: #fff; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file-btn:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
  .ghost { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; min-height: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 16px 4px; }
  aside .hint { color: var(--muted); font-size: 12px; padding: 0 16px 6px; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 16px 10px; }
  .summary-block { border-bottom: 1px solid var(--border); }
  ol.steps { list-style: none; margin: 0; padding: 8px 8px 16px; }

  .step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px; }
  .step:hover { background: var(--panel-2); }
  .step[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .step .num { width: 24px; height: 24px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .step[aria-current="true"] .num { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step .action { font-weight: 650; text-transform: capitalize; }
  .step .sel { color: var(--muted); font-size: 12px; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .step .chips { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .step .delta { display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; font-size: 12px; font-weight: 600; }
  .step .info { margin-top: 3px; font-size: 11px; color: var(--muted); }

  .d-new { color: var(--bad); } .d-new.zero { color: var(--muted); font-weight: 500; }
  .d-carry { color: var(--carry); } .d-carry.zero { color: var(--muted); font-weight: 500; }
  .d-re { color: var(--serious); }
  .pill.re { color: var(--serious); background: var(--panel-2); border-color: var(--serious); }
  .chip.re { color: var(--serious); }
  .hist { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .d-res { color: var(--good); } .d-res.zero { color: var(--muted); font-weight: 500; }

  main { min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .card > .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .card > .head h3 { margin: 0; font-size: 14px; }
  .card > .head.url { color: var(--muted); font-size: 12px; word-break: break-all; }

  .state { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2); border-radius: 10px 10px 0 0; align-items: center; }
  .state .eq { font-weight: 650; }
  .pill { display: inline-flex; gap: 5px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; border: 1px solid var(--border); background: var(--panel); }
  .pill.new { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
  .pill.carry { color: var(--carry); background: var(--carry-soft); border-color: transparent; }
  .pill.res { color: var(--good); background: var(--good-soft); border-color: transparent; }
  .state .note { color: var(--muted); font-size: 12px; }

  .viewer { padding: 12px; background: var(--panel-2); display: grid; place-items: center; min-height: 200px; border-radius: 0 0 10px 10px; }
  .viewer img { max-width: 100%; max-height: 70vh; border: 1px solid var(--border); background: #fff; display: block; cursor: zoom-in; }
  .viewer img.full { max-height: none; cursor: zoom-out; }
  .viewer-wrap { overflow: auto; max-width: 100%; }
  .noimg { color: var(--muted); padding: 40px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .sev-Critical { color: var(--critical); } .sev-Serious { color: var(--serious); }
  .sev-Moderate { color: var(--moderate); } .sev-Minor { color: var(--minor); }
  .sev-Manual { color: var(--manual); } .sev-Informative { color: var(--informative); }
  .chip.ok { color: var(--good); }
  .chip.zero { opacity: .4; }

  .tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab { background: transparent; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; padding: 6px 12px; font-weight: 600; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); border-color: var(--border); margin-bottom: -1px; border-bottom: 1px solid var(--panel); }
  .tab .count { margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px; background: var(--panel-2); }
  .tab .count small { font-weight: 500; opacity: .8; }
  .tab.new[aria-selected="true"] .count { background: var(--bad-soft); color: var(--bad); }
  .tab.persist[aria-selected="true"] .count { background: var(--carry-soft); color: var(--carry); }
  .tab.resolved[aria-selected="true"] .count { background: var(--good-soft); color: var(--good); }
  .tab-desc { padding: 8px 14px 0; color: var(--muted); font-size: 12px; }

  .toolbar { display: flex; gap: 8px; padding: 10px 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search], .toolbar select { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
  .toolbar input[type=search] { min-width: 220px; flex: 1; max-width: 360px; }
  .toolbar .count-info { color: var(--muted); font-size: 12px; margin-left: auto; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--panel-2); }
  tr.row { cursor: pointer; }
  tr.row.audit-start td { border-top: 4px solid var(--muted); }
  tr.row:hover td { background: var(--panel-2); }
  tr.row[aria-expanded="true"] td { background: var(--accent-soft); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  td.sel { max-width: 380px; word-break: break-all; color: var(--muted); }
  td.cat { color: var(--muted); }
  td.since { white-space: nowrap; }
  tr.detail td { background: var(--panel-2); }
  .detail dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; }
  .detail dt { color: var(--muted); font-weight: 600; }
  .detail dd { margin: 0; word-break: break-word; }
  .detail pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  .drop { margin: auto; width: min(560px, 92%); text-align: center; padding: 48px 24px; border: 2px dashed var(--border); border-radius: 14px; background: var(--panel); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop h2 { margin: 0 0 8px; font-size: 20px; }
  .drop p { margin: 0 0 16px; color: var(--muted); }
  .err { color: var(--critical); margin-top: 12px; font-weight: 600; }
  .welcome { grid-column: 1 / -1; display: flex; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 42vh; }
  }
</style>
</head>
<body>

<header>
  <h1>WICK-AG-Lens Report Viewer</h1>
  <span class="meta" id="meta">No file loaded</span>
  <span class="spacer"></span>
  <button class="ghost" id="themeBtn" type="button" title="Toggle light/dark theme">Theme</button>
  <label class="file-btn">
    Open JSON file
    <input type="file" id="fileInput" accept=".json,application/json">
  </label>
</header>

<div class="app" id="app">
  <div class="welcome">
    <div class="drop" id="drop">
      <h2>Drop a WICK-AG-Lens JSON file here</h2>
      <p>or use “Open JSON file” above. The file is read locally in your browser and never uploaded.</p>
      <div class="err" id="err" role="alert"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const SEVERITIES = ['Critical', 'Serious', 'Moderate', 'Minor', 'Manual', 'Informative'];
  const SEV_RANK = Object.fromEntries(SEVERITIES.map((s, i) => [s, i]));
  const isIssue = (sev) => sev !== 'Informative';
  const MAP_PREFIX = 'map:';

  const state = { data: null, idx: 0, tab: 'new', sev: '', q: '', expanded: new Set() };
  const $ = (id) => document.getElementById(id);
  const app = $('app');

  // ---------- tiny DOM helper (text only: report data is never inserted as HTML) ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function decodeEntities(s) { // dictionary text is stored HTML-escaped; decode to plain text
    const t = document.createElement('textarea');
    t.innerHTML = String(s ?? '');
    return t.value;
  }
  const DETECTION_LABELS = { 'rule': 'Rule-based', 'pattern': 'Pattern-based', 'best-effort': 'Best-effort' };
  function detectionText(i) { // how reliable the audit's detection is, plus its known limit (empty for rule-based checks)
    return `${DETECTION_LABELS[i.detection] || i.detection}${i.detection_note ? ' - ' + decodeEntities(i.detection_note) : ''}`;
  }

  $('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });

  // ---------- file loading ----------
  function showError(msg) { const e = $('err'); if (e) e.textContent = msg || ''; }

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => showError('Could not read file.');
    reader.onload = () => {
      try {
        // CLI stdout redirected to a file starts with "[Audit] ..." log lines before the JSON; skip them.
        let text = String(reader.result).replace(/^﻿/, '');
        if (!/^\s*\{/.test(text)) {
          const start = text.search(/^\{\s*$/m);
          if (start !== -1) text = text.slice(start);
        }
        const data = JSON.parse(text);
        if (!data || !Array.isArray(data.audit_trail)) throw new Error('No "audit_trail" array found in this file.');
        data.derived = derive(data);
        Object.assign(state, { data, idx: 0, tab: 'new', sev: '', q: '' });
        state.expanded.clear();
        $('meta').textContent = `${file.name} · ${data.audit_trail.length} steps` +
          (data.timestamp ? ` · ${new Date(data.timestamp).toLocaleString()}` : '');
        render();
      } catch (err) {
        showError('Invalid file: ' + err.message);
      }
    };
    reader.readAsText(file);
  }
  $('fileInput').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); const d = $('drop'); if (d) d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); const d = $('drop'); if (d) d.classList.remove('over'); }));
  window.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));

  // ---------- data model ----------
  // findings: { Group: { Category: [ {auditId, audit, severity, elements:[]} ] } } -> flat rows
  function flatten(findings) {
    const rows = [];
    for (const [group, cats] of Object.entries(findings || {})) {
      for (const [category, audits] of Object.entries(cats || {})) {
        for (const a of (Array.isArray(audits) ? audits : [])) {
          for (const el of (a.elements || [])) {
            rows.push({
              base: `${a.auditId}|${el.selector}|${el.issueText}`,   // same identity the scanner diffs with; derive() adds the occurrence number
              group, category, auditId: a.auditId, audit: a.audit, severity: a.severity,
              selector: el.selector, snippet: el.htmlSnippet, issue: el.issueText, legend: el.legend,
            });
          }
        }
      }
    }
    return rows;
  }
  const bySeverity = (a, b) => (SEV_RANK[a.severity] ?? 99) - (SEV_RANK[b.severity] ?? 99);

  // Rebuild, per step, the set of findings active on the page:
  //   active(n) = active(n-1) - resolved(n) + new(n)
  // (verified against health_scores). Then split it into "new" vs "still present".
  function derive(data) {
    let active = new Map();
    const seen = new Map(); // distinct findings seen in the whole run
    const onPage = new Map(); // base identity -> how many elements with it are on the page now
    const history = new Map(); // key -> closed episodes [{from, to}]: step ranges where it was on the page
    const steps = data.audit_trail.map((step, i) => {
      const stepNo = step.step ?? i + 1;
      const prev = active;
      const next = new Map(prev);

      // Elements can share selector + text (e.g. duplicate ids). Like the scanner, count them one by one: the n-th element
      // of a group is occurrence #n. Resolved ones leave from the top, new ones join at the top.
      const resolved = flatten(step.resolved_findings).map((row) => {
        const n = onPage.get(row.base) || 0;
        onPage.set(row.base, Math.max(0, n - 1));
        const r = { ...row, key: `${row.base}#${n}` };
        const was = prev.get(r.key);
        next.delete(r.key);
        if (!was) return { ...r, since: null, firstSeen: null, past: [] };
        history.set(r.key, [...(history.get(r.key) || []), { from: was.since, to: stepNo - 1 }]);
        return { ...r, since: was.since, firstSeen: was.firstSeen, past: was.past };
      });
      const added = flatten(step.new_findings).map((row) => {
        const n = (onPage.get(row.base) || 0) + 1;
        onPage.set(row.base, n);
        const r = { ...row, key: `${row.base}#${n}` };
        const past = [...(history.get(r.key) || [])]; // non-empty => it was here before, went away, and is back
        return { ...r, since: stepNo, firstSeen: past.length ? past[0].from : stepNo, past, reappeared: past.length > 0 };
      });
      added.forEach((r) => { next.set(r.key, r); if (!seen.has(r.key)) seen.set(r.key, r); });

      const newKeys = new Set(added.map((r) => r.key));
      const persisting = [...next.values()].filter((r) => !newKeys.has(r.key));
      active = next;

      const maps = Object.entries(step.page_state_maps || {}).map(([id, m]) => ({
        id, label: m.audit || id, elements: m.elements || [], total: m.totalElems ?? (m.elements || []).length,
      })).filter((m) => m.elements.length);

      return {
        stepNo,
        added: added.sort(bySeverity), persisting: persisting.sort(bySeverity), resolved: resolved.sort(bySeverity),
        activeCount: active.size, maps,
      };
    });
    return { steps, seen: [...seen.values()] };
  }

  function sevCounts(rows) { const c = {}; rows.forEach((r) => { c[r.severity] = (c[r.severity] || 0) + 1; }); return c; }
  const issueCount = (rows) => rows.filter((r) => isIssue(r.severity)).length;
  const reappearedCount = (rows) => issueCount(rows.filter((r) => r.reappeared));
  const rangeText = (e) => (e.from === e.to ? `step ${e.from}` : `steps ${e.from}–${e.to}`);
  const pastText = (r) => (r.past || []).map(rangeText).join(', ');
  const sinceText = (r) => (r.since == null ? '—'
    : `Step ${r.since}` + (r.firstSeen != null && r.firstSeen !== r.since ? ` (first seen step ${r.firstSeen})` : ''));
  const infoCount = (rows) => rows.length - issueCount(rows);

  function imageSrc(b64) {
    if (!b64) return null;
    if (b64.startsWith('data:')) return b64;
    let mime = 'image/png';
    if (b64.startsWith('/9j/')) mime = 'image/jpeg';
    else if (b64.startsWith('UklGR')) mime = 'image/webp';
    else if (b64.startsWith('R0lGOD')) mime = 'image/gif';
    return `data:${mime};base64,${b64}`;
  }

  function sevChip(sev, n) { return h('span', { class: `chip sev-${sev}${n === 0 ? ' zero' : ''}` }, n == null ? sev : `${sev} ${n}`); }

  // ---------- rendering ----------
  function render() {
    app.replaceChildren(buildSidebar(state.data), h('main', { id: 'main' }));
    renderMain();
  }

  function buildSidebar(data) {
    const distinct = sevCounts(data.derived.seen);
    const distinctChips = SEVERITIES.filter((s) => s in distinct).map((s) => sevChip(s, distinct[s]));

    const summary = h('div', { class: 'summary-block' },
      h('h2', {}, 'Distinct findings, whole run'),
      h('div', { class: 'hint' }, 'Each finding counted once, even if it persisted across steps or was later resolved.'),
      h('div', { class: 'summary' }, distinctChips));

    const list = h('ol', { class: 'steps' });
    data.audit_trail.forEach((step, i) => {
      const d = data.derived.steps[i];
      const active = [...d.added, ...d.persisting];
      const ac = sevCounts(active);
      const chips = SEVERITIES.filter((s) => isIssue(s) && ac[s] > 0).map((s) => sevChip(s, ac[s]));
      if (!chips.length) chips.push(h('span', { class: 'chip ok' }, 'No issues on page'));

      const nRe = reappearedCount(d.added);
      const nNew = issueCount(d.added) - nRe, nCarry = issueCount(d.persisting), nRes = issueCount(d.resolved);
      const cls = (base, n) => `${base}${n === 0 ? ' zero' : ''}`;
      const delta = h('div', { class: 'delta' },
        h('span', { class: cls('d-new', nNew), title: 'Issues first detected at this step' }, `+${nNew} new`),
        nRe ? h('span', { class: 'd-re', title: 'Issues seen in an earlier step, resolved, and back again' }, `⟲ ${nRe} reappeared`) : null,
        h('span', { class: cls('d-carry', nCarry), title: 'Issues detected in earlier steps that are still on the page' }, `↻ ${nCarry} still present`),
        h('span', { class: cls('d-res', nRes), title: 'Issues from earlier steps that are gone' }, `✓ ${nRes} resolved`));
      const info = h('div', { class: 'info' },
        `Info notes: ${infoCount(active)} on page (+${infoCount(d.added)} new, ${infoCount(d.resolved)} resolved)`);

      list.append(h('li', {}, h('button', {
        class: 'step', type: 'button', 'data-i': i, 'aria-current': i === state.idx ? 'true' : 'false',
        onclick: () => selectStep(i),
      },
        h('span', { class: 'num' }, d.stepNo),
        h('span', {},
          h('div', { class: 'action' }, step.interaction?.action || 'step'),
          h('div', { class: 'sel' }, step.interaction?.selector || ''),
          h('div', { class: 'chips' }, chips), delta, info))));
    });

    return h('aside', { 'aria-label': 'Timeline of steps' }, summary, h('h2', {}, 'Steps timeline'), list);
  }

  function selectStep(i) {
    state.idx = Math.max(0, Math.min(state.data.audit_trail.length - 1, i));
    state.expanded.clear();
    document.querySelectorAll('.step').forEach((b) => b.setAttribute('aria-current', Number(b.dataset.i) === state.idx ? 'true' : 'false'));
    renderMain();
    const cur = document.querySelector('.step[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  function availableTabs(d) {
    const tabs = [
      { id: 'new', cls: 'new', label: 'New findings', rows: d.added,
        desc: 'First detected at this step.' },
      { id: 'persist', cls: 'persist', label: 'Still present', rows: d.persisting,
        desc: 'Detected in earlier steps and still on the page. Shown for quick reference, so not new at this step.' },
      { id: 'resolved', cls: 'resolved', label: 'Resolved', rows: d.resolved,
        desc: 'Present in earlier steps but no longer on the page.' },
    ];
    d.maps.forEach((m) => tabs.push({
      id: MAP_PREFIX + m.id, cls: 'map', label: m.label, map: m, rows: m.elements,
      desc: 'Full snapshot of this page state, not incremental: it lists everything on the page at this step.',
    }));
    return tabs;
  }

  function renderMain() {
    const step = state.data.audit_trail[state.idx];
    const d = state.data.derived.steps[state.idx];
    const main = $('main');
    const hs = step.health_scores || {};

    const nRe = reappearedCount(d.added);
    const nNew = issueCount(d.added) - nRe, nCarry = issueCount(d.persisting), nRes = issueCount(d.resolved);
    const total = nNew + nRe + nCarry;
    const banner = h('div', { class: 'state' },
      h('span', { class: 'eq' }, `Page now has ${total} issue${total === 1 ? '' : 's'}:`),
      h('span', { class: 'pill new' }, `${nNew} new`),
      nRe ? h('span', { class: 'pill re', title: 'Seen in an earlier step, resolved, and back again' }, `${nRe} reappeared`) : null,
      h('span', { class: 'pill carry' }, `${nCarry} still present from earlier steps`),
      h('span', { class: 'pill res' }, `${nRes} resolved`),
      h('span', { class: 'note' }, `· plus ${infoCount(d.added) + infoCount(d.persisting)} informative notes`));

    const src = imageSrc(step.screenshot_base64);
    const img = src ? h('img', {
      src, alt: `Screenshot for step ${d.stepNo}: ${step.interaction?.action || ''}`,
      onclick: (e) => e.currentTarget.classList.toggle('full'), title: 'Click to toggle full size',
    }) : h('div', { class: 'noimg' }, 'No screenshot for this step.');

    const viewer = h('section', { class: 'card' },
      h('div', { class: 'head' },
        h('h3', {}, `Step ${d.stepNo} · ${step.interaction?.action || ''}`),
        h('span', { class: 'mono' }, step.interaction?.selector || ''),
        step.execution_time_ms != null ? h('span', {
          class: 'chip', title: 'Time spent running the audits once the page was considered stable. It does not include page load or waiting for the page to settle.',
        }, `Audits ran in ${step.execution_time_ms} ms`) : null),
      step.url ? h('div', { class: 'head url' }, step.url) : null,
      banner,
      h('div', { class: 'viewer' }, h('div', { class: 'viewer-wrap' }, img)));

    const tabs = availableTabs(d);
    if (!tabs.some((t) => t.id === state.tab)) state.tab = 'new';

    const tabBar = h('div', { class: 'tabs', role: 'tablist' }, tabs.map((t) => {
      const count = t.map ? t.rows.length : issueCount(t.rows);
      const info = t.map ? 0 : infoCount(t.rows);
      return h('button', {
        class: `tab ${t.cls}`, type: 'button', role: 'tab', 'aria-selected': state.tab === t.id ? 'true' : 'false',
        title: t.desc,
        onclick: () => { state.tab = t.id; state.expanded.clear(); renderMain(); },
      }, t.label, h('span', { class: 'count' }, count, info ? h('small', {}, ` +${info} info`) : null));
    }));

    main.replaceChildren(viewer, h('section', { class: 'card', id: 'tableCard' }, tabBar, h('div', { id: 'tabBody' })));
    renderTabBody(tabs.find((t) => t.id === state.tab));
  }

  function filterRows(tab) {
    const q = state.q.trim().toLowerCase();
    return tab.rows.filter((r) => {
      if (!tab.map && state.sev) {
        if (state.sev === 'Issues' ? !isIssue(r.severity) : r.severity !== state.sev) return false;
      }
      return !q || [r.audit, r.category, r.group, r.selector ?? '', r.snippet ?? r.htmlSnippet ?? '', r.issue ?? r.issueText ?? '', r.legend ?? '']
        .join('\n').toLowerCase().includes(q);
    });
  }

  function renderTabBody(tab) {
    const body = $('tabBody');
    const search = h('input', {
      type: 'search', placeholder: 'Search audit, selector, snippet…', value: state.q, 'aria-label': 'Search',
      oninput: (e) => { state.q = e.target.value; refreshTable(tab); },
    });
    const controls = [search];
    if (!tab.map) {
      const sc = sevCounts(tab.rows);
      controls.push(h('select', {
        'aria-label': 'Filter by severity',
        onchange: (e) => { state.sev = e.target.value; refreshTable(tab); },
      },
        h('option', { value: '', selected: state.sev === '' }, `All severities (${tab.rows.length})`),
        h('option', { value: 'Issues', selected: state.sev === 'Issues' }, `Issues only (${issueCount(tab.rows)})`),
        SEVERITIES.map((s) => h('option', { value: s, selected: state.sev === s }, `${s} (${sc[s] || 0})`))));
    }
    controls.push(h('span', { class: 'count-info', id: 'countInfo' }));
    body.replaceChildren(
      h('div', { class: 'tab-desc' }, tab.desc),
      h('div', { class: 'toolbar' }, controls),
      h('div', { class: 'table-wrap', id: 'tableHost' }));
    refreshTable(tab);
  }

  function refreshTable(tab) {
    const rows = filterRows(tab);
    $('countInfo').textContent = rows.length === tab.rows.length ? `${rows.length} items` : `${rows.length} of ${tab.rows.length} items`;
    $('tableHost').replaceChildren(buildTable(tab, rows));
  }

  function buildTable(tab, rows) {
    if (!rows.length) {
      return h('div', { class: 'empty' }, tab.rows.length ? 'Nothing matches the current filter.' : 'Nothing to show here for this step.');
    }
    const dict = state.data.audit_dictionary || {};
    const isMap = !!tab.map;
    const sinceLabel = tab.id === 'persist' ? 'On page since' : tab.id === 'resolved' ? 'Was on page since' : null;
    const showHistory = tab.id === 'new';

    const cols = isMap ? ['Order', 'Status', 'Selector'] : ['Severity', 'Audit', 'Category', 'Issue', 'Selector'];
    if (sinceLabel) cols.push(sinceLabel);
    if (showHistory) cols.push('History');

    const tbody = h('tbody');
    rows.forEach((r, i) => {
      const open = state.expanded.has(i);
      const cells = isMap
        ? [h('td', { class: 'mono' }, r.issueText || ''), h('td', {}, r.legend || ''), h('td', { class: 'sel mono' }, r.selector || '')]
        : [h('td', {}, sevChip(r.severity)), h('td', {}, r.audit), h('td', { class: 'cat' }, `${r.group} › ${r.category}`),
           h('td', { class: 'mono' }, r.issue || ''), h('td', { class: 'sel mono' }, r.selector || '')];
      if (sinceLabel) cells.push(h('td', { class: 'since' }, sinceText(r)));
      if (showHistory) cells.push(h('td', { class: 'since' }, r.reappeared
        ? [h('span', { class: 'chip re' }, '⟲ Reappeared'), h('div', { class: 'hist' }, `Earlier: ${pastText(r)}`)]
        : 'First time'));

      // thick divider when a different audit starts (not for the focus-order map: one audit only)
      const newAudit = !isMap && i > 0 && r.auditId !== rows[i - 1].auditId;
      tbody.append(h('tr', {
        class: `row${newAudit ? ' audit-start' : ''}`, tabindex: 0, 'aria-expanded': open ? 'true' : 'false',
        onclick: () => toggle(i),
        onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(i); } },
      }, cells));
      if (open) tbody.append(detailRow(r, isMap, dict[r.auditId], cols.length));
    });
    function toggle(i) {
      state.expanded.has(i) ? state.expanded.delete(i) : state.expanded.add(i);
      $('tableHost').replaceChildren(buildTable(tab, rows));
    }
    return h('table', {}, h('thead', {}, h('tr', {}, cols.map((c) => h('th', { scope: 'col' }, c)))), tbody);
  }

  // references are {url, title} objects (plain strings tolerated); only http(s) URLs become links
  function wcagLinks(refs) {
    const out = [];
    refs.forEach((ref, n) => {
      const title = typeof ref === 'string' ? ref : (ref.title || ref.url || '');
      const url = typeof ref === 'object' ? ref.url : null;
      if (n) out.push(h('br'));
      out.push(url && /^https?:\/\//i.test(url)
        ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, title)
        : title);
    });
    return out;
  }

  function detailRow(r, isMap, info, span) {
    const i = info && info.info;
    const snippet = isMap ? r.htmlSnippet : r.snippet;
    const dl = h('dl', {},
      h('dt', {}, 'Selector'), h('dd', { class: 'mono' }, r.selector || '—'),
      h('dt', {}, 'HTML'), h('dd', {}, h('pre', { class: 'mono' }, snippet || '—')),
      r.legend && !isMap ? [h('dt', {}, 'Legend'), h('dd', {}, r.legend)] : null,
      !isMap && (r.past || []).length ? [h('dt', {}, 'History'), h('dd', {}, `Previously on the page at ${pastText(r)}, resolved, then back.`)] : null,
      i ? [
        h('dt', {}, 'What'), h('dd', {}, decodeEntities(i.what)),
        h('dt', {}, 'Why'), h('dd', {}, decodeEntities(i.why)),
        h('dt', {}, 'How to fix'), h('dd', {}, decodeEntities(i.fix)),
        i.detection ? [h('dt', {}, 'Detection'), h('dd', {}, detectionText(i))] : null,
        (i.wcag_references || []).length ? [h('dt', {}, 'WCAG'), h('dd', {}, wcagLinks(i.wcag_references))] : null,
      ] : null);
    return h('tr', { class: 'detail' }, h('td', { colspan: span }, dl));
  }

  // ---------- keyboard: Up/Down move between steps ----------
  window.addEventListener('keydown', (e) => {
    if (!state.data || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); selectStep(state.idx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); selectStep(state.idx - 1); }
  });
})();
</script>
</body>
</html>
