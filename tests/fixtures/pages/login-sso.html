<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Single sign-on</title></head>
<body>
  <main>
    <h1>Single sign-on</h1>
    <!-- Two-screen flow like Okta / Microsoft: user name first, then the password field appears asynchronously -->
    <form method="post" action="/login">
      <div id="screen-user">
        <label for="sso-user">User</label>
        <input id="sso-user" name="user" type="text" autocomplete="username">
        <button id="next" type="button">Next</button>
      </div>
      <div id="screen-password" hidden>
        <label for="sso-password">Password</label>
        <input id="sso-password" name="password" type="password" autocomplete="current-password">
        <button id="signin" type="submit">Sign in</button>
      </div>
    </form>
  </main>
  <script>
    document.getElementById('next').addEventListener('click', () => {
      document.getElementById('screen-user').hidden = true;
      setTimeout(() => { document.getElementById('screen-password').hidden = false; }, 400);
    });
  </script>
</body>
</html>
