<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Blind spot page</title>
  <style>.fake { display: inline-block; padding: 8px 14px; background: #1a73e8; color: #fff; cursor: pointer; }</style>
</head>
<body>
  <main>
    <h1>Blind spot page</h1>
    <!-- A real, accessible control: it has a role and a name, so an accessibility-tree snapshot lists it. -->
    <button id="real-buy" onclick="document.getElementById('result').textContent='real'">Buy now (button)</button>
    <!-- A fake control: a clickable <div> with no role, no tabindex and no keyboard support.
         It is not in the accessibility tree as something interactive, so an agent cannot target it by @ref. -->
    <div id="fake-buy" class="fake" onclick="document.getElementById('result').textContent='fake'">Buy now (div)</div>
    <p id="result" role="status"></p>
  </main>
</body>
</html>
